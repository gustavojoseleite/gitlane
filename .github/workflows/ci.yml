name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rfE --tb=short 2>&1 | tee pytest.log
      - name: Show failing tests as annotations
        if: failure()
        shell: bash
        # GitHub shows at most 10 annotations per step, so send the whole list as one.
        run: echo "::error title=Failing tests::$(grep -E '^(FAILED|ERROR) ' pytest.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"

  browser:
    name: Browser tests (Chrome)
    runs-on: ubuntu-latest  # Google Chrome is preinstalled on GitHub's Ubuntu runners
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev,e2e]"
      - name: Run browser tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rfE --tb=short tests/test_e2e.py 2>&1 | tee pytest.log
      - name: Show failing tests as annotations
        if: failure()
        shell: bash
        # GitHub shows at most 10 annotations per step, so send the whole list as one.
        run: echo "::error title=Failing tests::$(grep -E '^(FAILED|ERROR) ' pytest.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"

  package:
    name: Build and test the installed package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - name: Install the wheel in a clean environment and test it (not the source folder)
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl pytest httpx
          /tmp/clean/bin/gitlane --version
          cp -r tests /tmp/tests && cd /tmp
          set -o pipefail
          /tmp/clean/bin/python -m pytest -q -rfE --tb=short -p no:cacheprovider tests 2>&1 | tee /tmp/pytest.log
      - name: Show failing tests as annotations
        if: failure()
        run: echo "::error title=Failing tests::$(grep -E '^(FAILED|ERROR) ' /tmp/pytest.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
