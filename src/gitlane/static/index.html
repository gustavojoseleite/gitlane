<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>gitlane</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <header>
    <span class="logo">gitlane</span>
    <button id="refresh" type="button" title="Refresh (R)">Refresh</button>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <div id="status"
           hx-get="/partials/status"
           hx-trigger="load, focus from:window, gitlane:refresh from:body">
        <p class="muted">Loading…</p>
      </div>
      <form id="commit-form" class="commit" hx-post="/actions/commit" hx-target="#status">
        <label for="summary">Commit</label>
        <div class="summary-row">
          <input type="text" id="summary" name="summary" autocomplete="off"
                 placeholder="Summary (required)" aria-describedby="summary-count">
          <span id="summary-count" class="counter" title="Keep the summary under 72 characters"></span>
        </div>
        <textarea id="description" name="description" rows="4"
                  placeholder="Description (optional)"></textarea>
        <button type="submit" class="primary">Commit staged changes</button>
        <span class="hint">Ctrl+Enter</span>
      </form>
    </aside>
    <div id="g1" class="gutter" role="separator" tabindex="0" aria-orientation="vertical"
         aria-label="Resize sidebar" title="Drag to resize · double-click to reset"></div>
    <main class="graph-panel">
      <div id="graph" hx-get="/partials/graph" hx-trigger="load">
        <p class="muted">Loading history…</p>
      </div>
    </main>
    <div id="g2" class="gutter" role="separator" tabindex="0" aria-orientation="vertical"
         aria-label="Resize details panel" title="Drag to resize · double-click to reset"></div>
    <section id="detail" class="detail-panel">
      <p class="muted">Click a commit or a file to see its details.</p>
    </section>
  </div>
  <div id="ctx-menu" class="ctx-menu" role="menu" hidden></div>
  <script>
    (() => {
      const graphEl = document.getElementById("graph");
      const detail = document.getElementById("detail");
      const summary = document.getElementById("summary");
      const description = document.getElementById("description");
      const counter = document.getElementById("summary-count");
      const updateCounter = () => {
        const n = summary.value.length;
        counter.textContent = n ? String(72 - n) : "";
        counter.classList.toggle("long", n > 72);
      };
      summary.addEventListener("input", updateCounter);
      const EMPTY_DETAIL = '<p class="muted">Click a commit or a file to see its details.</p>';
      let currentDetail = null;  // URL shown in the detail panel
      let selectedSha = null;
      let refsVersion = null;

      const reloadDetail = () => { if (currentDetail) htmx.ajax("GET", currentDetail, "#detail"); };

      const reloadGraph = () => htmx.ajax("GET", "/partials/graph", "#graph");

      const checkRefs = async () => {
        try {
          const r = await fetch("/api/refs-version");
          if (!r.ok) return;
          const { version } = await r.json();
          if (refsVersion !== null && version !== refsVersion) reloadGraph();
          refsVersion = version;
        } catch (_) { /* server stopped; status panel shows the error */ }
      };

      const refresh = () => {
        htmx.trigger(document.body, "gitlane:refresh");
        reloadDetail();
        reloadGraph();
      };

      const showCommit = (sha) => {
        selectedSha = sha;
        graphEl.querySelectorAll(".row.selected").forEach((r) => r.classList.remove("selected"));
        const row = graphEl.querySelector(`.row[data-sha="${sha}"]`);
        if (row) row.classList.add("selected");
        htmx.ajax("GET", `/partials/commit?sha=${sha}`, "#detail");
      };

      document.getElementById("refresh").addEventListener("click", refresh);

      // ---- resizable panels -------------------------------------------------
      const layout = document.querySelector(".layout");
      const stacked = () => window.matchMedia("(max-width: 1200px)").matches;
      const SIZES = {  // css variable -> [default, min, max-fraction-of-layout]
        "--side-w": ["340px", 220, 0.45],
        "--detail-w": ["480px", 280, 0.6],
        "--graph-h": ["58%", 120, 0.85],
      };
      const loadSizes = () => {
        for (const v of Object.keys(SIZES)) {
          try { const saved = localStorage.getItem("gitlane" + v); if (saved) layout.style.setProperty(v, saved); } catch (_) {}
        }
      };
      const setSize = (v, px) => {
        const [, min, maxFrac] = SIZES[v];
        const total = v === "--graph-h" ? layout.clientHeight : layout.clientWidth;
        const value = Math.round(Math.max(min, Math.min(px, total * maxFrac))) + "px";
        layout.style.setProperty(v, value);
        try { localStorage.setItem("gitlane" + v, value); } catch (_) {}
      };
      const resetSize = (v) => {
        layout.style.removeProperty(v);
        try { localStorage.removeItem("gitlane" + v); } catch (_) {}
      };
      // Which variable a gutter controls depends on the layout (g2 is horizontal when stacked).
      const gutterVar = (g) => g.id === "g1" ? "--side-w" : (stacked() ? "--graph-h" : "--detail-w");
      const syncGutters = () => {
        document.getElementById("g2").setAttribute("aria-orientation", stacked() ? "horizontal" : "vertical");
      };
      const currentSize = (v) => {
        const panel = { "--side-w": ".sidebar", "--detail-w": ".detail-panel", "--graph-h": ".graph-panel" }[v];
        const r = document.querySelector(panel).getBoundingClientRect();
        return v === "--graph-h" ? r.height : r.width;
      };
      for (const g of document.querySelectorAll(".gutter")) {
        g.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          const v = gutterVar(g);
          const start = v === "--graph-h" ? e.clientY : e.clientX;
          const startSize = currentSize(v);
          const dir = v === "--detail-w" ? -1 : 1;  // the details panel grows when dragging left
          g.setPointerCapture(e.pointerId);
          g.classList.add("dragging");
          document.body.classList.add("resizing", v === "--graph-h" ? "row" : "col");
          const move = (ev) => setSize(v, startSize + dir * ((v === "--graph-h" ? ev.clientY : ev.clientX) - start));
          const up = () => {
            g.removeEventListener("pointermove", move);
            g.classList.remove("dragging");
            document.body.classList.remove("resizing", "row", "col");
          };
          g.addEventListener("pointermove", move);
          g.addEventListener("pointerup", up, { once: true });
          g.addEventListener("pointercancel", up, { once: true });
        });
        g.addEventListener("dblclick", () => resetSize(gutterVar(g)));
        g.addEventListener("keydown", (e) => {
          const v = gutterVar(g);
          const keys = v === "--graph-h" ? { ArrowUp: -1, ArrowDown: 1 } : { ArrowLeft: -1, ArrowRight: 1 };
          if (!(e.key in keys)) return;
          e.preventDefault();
          const dir = v === "--detail-w" ? -1 : 1;
          setSize(v, currentSize(v) + keys[e.key] * dir * (e.shiftKey ? 64 : 16));
        });
      }
      loadSizes();
      syncGutters();
      window.addEventListener("resize", syncGutters);

      // ---- right-click menus ------------------------------------------------
      const menu = document.getElementById("ctx-menu");
      const currentBranch = () => document.querySelector("#status .repo")?.dataset.branch || "";
      const post = (url, values, confirmText) => {
        if (confirmText && !window.confirm(confirmText)) return;
        htmx.ajax("POST", url, { target: "#status", values });
      };
      const closeMenu = () => { menu.hidden = true; menu.innerHTML = ""; };

      // Buttons that ask a question first (New branch, Stash…).
      document.body.addEventListener("click", (e) => {
        const b = e.target.closest("[data-prompt-url]");
        if (!b) return;
        const answer = window.prompt(b.dataset.prompt, b.dataset.promptDefault || "");
        if (answer === null) return;  // cancelled
        post(b.dataset.promptUrl, { [b.dataset.promptField]: answer });
      });

      const openMenu = (x, y, items) => {
        menu.innerHTML = "";
        for (const item of items) {
          if (item === "-") { menu.appendChild(document.createElement("hr")); continue; }
          const b = document.createElement("button");
          b.type = "button";
          b.setAttribute("role", "menuitem");
          b.textContent = item.label;
          if (item.danger) b.classList.add("danger");
          if (item.disabled) { b.disabled = true; b.title = item.disabled; }
          b.addEventListener("click", () => { closeMenu(); item.run(); });
          menu.appendChild(b);
        }
        menu.hidden = false;
        const r = menu.getBoundingClientRect();
        menu.style.left = Math.min(x, window.innerWidth - r.width - 8) + "px";
        menu.style.top = Math.min(y, window.innerHeight - r.height - 8) + "px";
        menu.querySelector("button:not(:disabled)")?.focus();
      };

      const commitItems = (sha, isMerge) => {
        const short = sha.slice(0, 7);
        const branch = currentBranch();
        const onto = branch || "the current commit";
        const mergeNote = isMerge ? "Not available for merge commits yet" : "";
        return [
          { label: `Checkout ${short}`, run: () => post("/actions/commit/checkout", { sha },
              `Check out ${short}?\n\nYou will be in "detached HEAD": new commits won't belong to ` +
              "any branch until you create one.") },
          { label: "Create branch here…", run: () => {
              const name = window.prompt(`Name for the new branch at ${short}:`);
              if (name) post("/actions/branch/create", { name, start: sha });
          } },
          "-",
          { label: `Cherry-pick onto ${onto}`, disabled: mergeNote,
            run: () => post("/actions/commit/cherry-pick", { sha }) },
          { label: "Revert this commit", disabled: mergeNote,
            run: () => post("/actions/commit/revert", { sha },
              `Revert ${short}?\n\nThis adds a new commit that undoes its changes.`) },
          "-",
          { label: `Reset ${branch || "HEAD"} here — soft (keep changes staged)`,
            run: () => post("/actions/commit/reset", { sha, mode: "soft" },
              `Move ${branch || "HEAD"} to ${short}?\n\nCommits after it leave the branch; ` +
              "their changes stay staged.") },
          { label: `Reset ${branch || "HEAD"} here — mixed (keep changes unstaged)`,
            run: () => post("/actions/commit/reset", { sha, mode: "mixed" },
              `Move ${branch || "HEAD"} to ${short}?\n\nCommits after it leave the branch; ` +
              "their changes stay in your files, unstaged.") },
          { label: `Reset ${branch || "HEAD"} here — hard (discard everything)`, danger: true,
            run: () => post("/actions/commit/reset", { sha, mode: "hard" },
              `HARD reset ${branch || "HEAD"} to ${short}?\n\nAll uncommitted changes AND the ` +
              "commits after it will be thrown away. This cannot be undone from gitlane.") },
          "-",
          { label: "Copy commit hash", run: () => navigator.clipboard?.writeText(sha) },
        ];
      };

      const refItems = (kind, name, sha) => {
        const branch = currentBranch();
        const mergeItem = {
          label: branch ? `Merge ${name} into ${branch}` : "Merge (switch to a branch first)",
          disabled: branch ? "" : "You are not on a branch",
          run: () => post("/actions/branch/merge", { name }, `Merge ${name} into ${branch}?`),
        };
        if (kind === "branch") {
          return [
            { label: `Checkout ${name}`, run: () => post("/actions/branch/checkout", { name }) },
            mergeItem,
            "-",
            { label: `Delete ${name}…`, danger: true,
              run: () => post("/actions/branch/delete", { name }, `Delete the branch ${name}?`) },
          ];
        }
        if (kind === "remote") {
          return [
            { label: `Checkout ${name} as a local branch`,
              run: () => post("/actions/branch/checkout", { name }) },
            mergeItem,
          ];
        }
        if (kind === "head") {
          return [{ label: `${name} is the current branch`, disabled: "Already checked out", run: () => {} },
                  ...(sha ? ["-", ...commitItems(sha, false).slice(1, 2)] : [])];
        }
        if (kind === "tag" && sha) {
          return [{ label: `Checkout tag ${name}`, run: () => post("/actions/commit/checkout", { sha },
              `Check out tag ${name}?\n\nYou will be in "detached HEAD".`) }];
        }
        return null;
      };

      document.body.addEventListener("contextmenu", (e) => {
        const ref = e.target.closest("[data-ref-kind]");
        const row = e.target.closest(".row[data-sha]");
        let items = null;
        if (ref) items = refItems(ref.dataset.refKind, ref.dataset.refName, row?.dataset.sha);
        if (!items && row) items = commitItems(row.dataset.sha, row.dataset.merge === "1");
        if (!items) return;
        e.preventDefault();
        if (row) showCommit(row.dataset.sha);
        openMenu(e.clientX, e.clientY, items);
      });
      document.addEventListener("click", (e) => { if (!menu.contains(e.target)) closeMenu(); });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });
      window.addEventListener("blur", closeMenu);
      document.querySelectorAll(".graph-panel, .sidebar").forEach((el) =>
        el.addEventListener("scroll", closeMenu, { passive: true }));

      // Keep the "Remote branches" list open/closed across refreshes.
      document.body.addEventListener("toggle", (e) => {
        if (e.target.id === "remote-branches") {
          try { sessionStorage.setItem("remotesOpen", e.target.open ? "1" : ""); } catch (_) {}
        }
      }, true);
      document.body.addEventListener("htmx:afterSwap", () => {
        const d = document.getElementById("remote-branches");
        try { if (d && sessionStorage.getItem("remotesOpen")) d.open = true; } catch (_) {}
      });
      window.addEventListener("focus", () => { reloadDetail(); checkRefs(); });

      // One click handler for all graph rows and parent links.
      document.body.addEventListener("click", (e) => {
        const target = e.target.closest(".row[data-sha], .sha-link[data-sha]");
        if (target) showCommit(target.dataset.sha);
      });
      graphEl.addEventListener("keydown", (e) => {
        const row = e.target.closest(".row");
        if (!row) return;
        if (e.key === "Enter") showCommit(row.dataset.sha);
        if (e.key === "ArrowDown" || e.key === "ArrowUp") {
          e.preventDefault();
          const next = e.key === "ArrowDown" ? row.nextElementSibling : row.previousElementSibling;
          if (next && next.matches(".row")) { next.focus(); showCommit(next.dataset.sha); }
        }
      });

      // Remember what the detail panel shows so it can be reloaded.
      document.body.addEventListener("htmx:beforeRequest", (e) => {
        if (e.detail.target === detail) currentDetail = e.detail.requestConfig.path;
      });

      // Keep every graph row the same width: use the widest page so far.
      document.body.addEventListener("htmx:afterSettle", (e) => {
        if (!graphEl.contains(e.detail.elt) && e.detail.elt !== graphEl) return;
        const widths = [...graphEl.querySelectorAll(".page[data-graph-width]")]
          .map((p) => +p.dataset.graphWidth);
        graphEl.style.setProperty("--lanes", Math.max(1, ...widths));
        if (selectedSha) {
          const row = graphEl.querySelector(`.row[data-sha="${selectedSha}"]`);
          if (row) row.classList.add("selected");
        }
        checkRefs();
      });

      document.body.addEventListener("gitlane:changed", () => { reloadDetail(); checkRefs(); });
      document.body.addEventListener("gitlane:committed", () => {
        summary.value = "";
        description.value = "";
        updateCounter();
        currentDetail = null;
        detail.innerHTML = EMPTY_DETAIL;
      });

      // Ctrl+Enter commits from either field; plain Enter in the summary
      // moves to the description instead of committing by accident.
      for (const field of [summary, description]) {
        field.addEventListener("keydown", (e) => {
          if (e.key !== "Enter") return;
          if (e.ctrlKey || e.metaKey) {
            e.preventDefault();
            document.getElementById("commit-form").requestSubmit();
          } else if (field === summary) {
            e.preventDefault();
            description.focus();
          }
        });
      }
      document.addEventListener("keydown", (e) => {
        if (e.key === "r" && !e.ctrlKey && !e.metaKey && !e.altKey &&
            !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) {
          refresh();
        }
      });
      document.body.addEventListener("htmx:responseError", (e) => {
        e.detail.target.innerHTML =
          '<p class="error">Request failed (HTTP ' + e.detail.xhr.status +
          '). If gitlane was restarted, open the new link from your terminal.</p>';
      });
    })();
  </script>
</body>
</html>
